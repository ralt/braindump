# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.audio_storage_path: '%kernel.project_dir%/storage/audio'
    app.oidc_enabled: '%env(bool:OIDC_ENABLED)%'
    app.whisper_model_dir: '%kernel.project_dir%/var/whisper'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Controller\RecordingController:
        arguments:
            $audioStoragePath: '%app.audio_storage_path%'

    App\MessageHandler\TranscribeRecordingHandler:
        arguments:
            $audioStoragePath: '%app.audio_storage_path%'

    App\Service\ApiKeyEncryptorInterface:
        alias: App\Service\SecretBoxApiKeyEncryptor

    App\Service\SecretBoxApiKeyEncryptor:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Search\SearchProviderFactory:
        arguments:
            $searchProvider: '%env(SEARCH_PROVIDER)%'
            $openSearchUrl: '%env(OPENSEARCH_URL)%'
            $openSearchIndex: '%env(OPENSEARCH_INDEX)%'

    App\Search\SearchProviderInterface:
        factory: ['@App\Search\SearchProviderFactory', 'create']

    App\Transcription\TranscriberFactory:
        arguments:
            $transcriber: '%env(TRANSCRIBER)%'
            $whisperBinary: '%env(WHISPER_CLI)%'
            $whisperModel: '%env(resolve:WHISPER_MODEL)%'
            $ffmpegBinary: '%env(FFMPEG_BINARY)%'

    App\Transcription\TranscriberInterface:
        factory: ['@App\Transcription\TranscriberFactory', 'create']

    App\Command\DownloadWhisperModelCommand:
        arguments:
            $whisperModelDir: '%app.whisper_model_dir%'

    App\Command\CiRunCommand:
        arguments:
            $upsunApiToken: '%env(UPSUN_API_TOKEN)%'
            $ciNotificationEmail: '%env(CI_NOTIFICATION_EMAIL)%'
            $ciEmailDomain: '%env(CI_EMAIL_DOMAIN)%'

    App\Command\CiTriggerCommand:
        arguments:
            $upsunApiToken: '%env(UPSUN_API_TOKEN)%'
            $ciNotificationEmail: '%env(CI_NOTIFICATION_EMAIL)%'
            $ciEmailDomain: '%env(CI_EMAIL_DOMAIN)%'
            $openAiApiKey: '%env(OPENAI_API_KEY)%'
            $appSecret: '%env(APP_SECRET)%'

when@prod:
    services:
        App\Service\ApiKeyEncryptorInterface:
            alias: App\Service\VaultKmsApiKeyEncryptor
