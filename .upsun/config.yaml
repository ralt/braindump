applications:
  app:
    type: 'php:8.4'
    source:
      root: '/'
      operations:
        update-dependencies:
          command: |
            set -e
            # Capture Composer's output so the commit message can list exactly what changed
            # (no LLM): its "Lock file operations" lines are the source of the message body.
            out="$(composer update --no-interaction 2>&1)"
            printf '%s\n' "$out"
            if ! git diff --quiet composer.lock; then
              changes="$(printf '%s\n' "$out" | sed -nE 's/^[[:space:]]*- (Upgrading|Downgrading|Locking|Removing) (.+)$/  - \1 \2/p')"
              git add composer.lock
              git commit -m "Update Composer dependencies" -m "${changes:-Refreshed composer.lock}"
            fi

    build:
      flavor: none

    dependencies:
      php:
        composer/composer: '^2'

    runtime:
      extensions:
        - pdo_pgsql
        - sodium
        - intl
        - mbstring
        - ctype
        - iconv
        - xsl

    hooks:
      build: |
        set -e
        curl -fs https://get.symfony.com/cloud/configurator | bash
        symfony-build
      deploy: symfony-deploy
      post_deploy: |
        set -e
        if [ "$PLATFORM_ENVIRONMENT_TYPE" != "production" ]; then
          # Tests run in the test kernel against this branch's real postgres DB (the suite
          # resets the schema and clears data, so the ephemeral CI branch's DB is wiped —
          # main is never touched). Two overrides are needed versus a plain `php bin/phpunit`:
          #  - APP_ENV=test: the platform exports APP_ENV=prod (and composer dump-env bakes
          #    it into .env.local.php), overriding phpunit.dist.xml's `<server ... force>`.
          #    Without this the prod kernel boots, framework.test is off, and every
          #    KernelTestCase errors with "test.service_container" missing.
          #  - --cache-directory: the image filesystem is read-only, so phpunit's default
          #    cache writes (.phpunit.cache / .phpunit.result.cache at the project root)
          #    fail and trip failOnWarning. Point them at the writable mount.
          APP_ENV=test php bin/phpunit --colors=never --cache-directory=var/cache/phpunit
        fi

    relationships:
      database: 'db:postgresql'
      mercure: 'mercure:mercure'
      vault_kms: 'vault_kms:api-keys'

    # Allow this app (where the weekly_ci cron runs) to trigger the on-demand "ci" task.
    authorizations:
      - type: task
        resource: ci
        action: operate

    mounts:
      '/var': { source: storage, source_path: var }
      '/storage/audio':
        source: service
        service: audio-storage
        source_path: audio

    web:
      commands:
        pre_start: symfony-pre-start
      locations:
        '/':
          root: 'public'
          passthru: '/index.php'
          scripts: true
          allow: true

    variables:
      env:
        APP_ENV: prod
        SEARCH_PROVIDER: postgres
      php:
        upload_max_filesize: 26M
        post_max_size: 27M
        memory_limit: 256M

    workers:
      transcription:
        commands:
          start: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M
        mounts:
          '/var': { source: storage, source_path: var }
          '/storage/audio':
            source: service
            service: audio-storage
            source_path: audio

    crons:
      # The cron only *triggers* the on-demand "ci" task (a cheap API call); the actual
      # branch/test/merge orchestration runs in the dedicated "ci" task container below,
      # so it doesn't consume production app resources. Symfony Cloud tasks cannot be scheduled
      # directly — a cron is the supported way to run one on a schedule.
      weekly_ci:
        spec: '0 3 * * 1'
        commands:
          start: php bin/console app:ci-trigger

tasks:
  # On-demand container that runs the dependency-update CI. Triggered weekly by the
  # weekly_ci cron via `app:ci-trigger`. Runs with its own (per-second billed)
  # resources instead of borrowing from the production app container.
  ci:
    type: 'php:8.4'
    source:
      root: '/'

    dependencies:
      php:
        composer/composer: '^2'

    runtime:
      extensions:
        - pdo_pgsql
        - sodium
        - intl
        - mbstring
        - ctype
        - iconv
        - xsl

    # DATABASE_URL/MAILER_DSN are derived from these in .environment; the command itself
    # only orchestrates the Symfony Cloud API, but the Symfony kernel needs them to boot in prod.
    relationships:
      database: 'db:postgresql'

    # Symfony needs a writable /var (cache + logs) at runtime — the image filesystem is
    # read-only. CI orchestration keeps nothing between runs, so an ephemeral tmp mount
    # is enough (writable, auto-allocated, no resources:set needed). A private mount also
    # avoids colliding with the production app's /var.
    mounts:
      '/var': { source: tmp, source_path: var }

    # No `env: view` authorization on purpose — the task does NOT inherit the project's
    # secrets ambiently. app:ci-trigger injects exactly the variables ci-run needs into
    # each run's payload instead (PLATFORM_* vars are always provided automatically).

    hooks:
      build: |
        set -e
        curl -fs https://get.symfony.com/cloud/configurator | bash
        symfony-build

    variables:
      env:
        APP_ENV: prod
        SEARCH_PROVIDER: postgres

    run:
      command: php bin/console app:ci-run
      timeout: 7200

services:
  db:
    type: postgresql:16

  mercure:
    type: mercure:0

  audio-storage:
    type: network-storage:2.0

  vault_kms:
    type: vault-kms:1.12
    configuration:
      endpoints:
        api-keys:
          - policy: encrypt
            key: api-keys
            type: encrypt
          - policy: decrypt
            key: api-keys
            type: encrypt

routes:
  'https://{default}/':
    type: upstream
    upstream: 'app:http'

  'https://{default}/.well-known/mercure':
    type: upstream
    upstream: 'mercure:mercure'
    cache:
      enabled: false
