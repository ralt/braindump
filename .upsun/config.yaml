applications:
  app:
    type: 'php:8.4'
    source:
      root: '/'
      operations:
        update-dependencies:
          command: |
            set -e
            composer update --lock --no-interaction
            if ! git diff --quiet composer.lock; then
              git add composer.lock
              git commit -m "Update composer.lock"
            fi

    build:
      flavor: none

    dependencies:
      php:
        composer/composer: '^2'
      nodejs:
        '@mariozechner/pi-coding-agent': '*'

    runtime:
      extensions:
        - pdo_pgsql
        - sodium
        - intl
        - mbstring
        - ctype
        - iconv
        - xsl

    hooks:
      build: |
        set -euo pipefail
        curl -fs https://get.symfony.com/cloud/configurator | bash
        symfony-build
      deploy: symfony-deploy
      post_deploy: |
        set -e
        if [ "$PLATFORM_ENVIRONMENT_TYPE" != "production" ]; then
          php bin/phpunit --colors=never
        fi

    relationships:
      database: 'db:postgresql'
      mercure: 'mercure:mercure'
      vault_kms: 'vault_kms:api-keys'

    mounts:
      '/var': { source: storage, source_path: var }
      '/storage/audio':
        source: service
        service: audio-storage
        source_path: audio

    web:
      commands:
        pre_start: symfony-pre-start
      locations:
        '/':
          root: 'public'
          passthru: '/index.php'
          scripts: true
          allow: true

    variables:
      env:
        APP_ENV: prod
        SEARCH_PROVIDER: postgres
      php:
        upload_max_filesize: 26M
        post_max_size: 27M
        memory_limit: 256M

    workers:
      transcription:
        commands:
          start: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M
        mounts:
          '/var': { source: storage, source_path: var }
          '/storage/audio':
            source: service
            service: audio-storage
            source_path: audio

      ai-session:
        commands:
          start: php bin/console messenger:consume ai-session --time-limit=3600 --memory-limit=512M
        mounts:
          '/var': { source: storage, source_path: var }
          '/.pi': { source: storage, source_path: pi }

    crons:
      weekly_ci:
        spec: '0 3 * * 1'
        commands:
          start: php bin/console app:ci-run

services:
  db:
    type: postgresql:16

  mercure:
    type: mercure:0

  audio-storage:
    type: network-storage:2.0

  vault_kms:
    type: vault-kms:1.12
    configuration:
      endpoints:
        api-keys:
          - policy: encrypt
            key: api-keys
            type: encrypt
          - policy: decrypt
            key: api-keys
            type: encrypt

routes:
  'https://{default}/':
    type: upstream
    upstream: 'app:http'

  'https://{default}/.well-known/mercure':
    type: upstream
    upstream: 'mercure:mercure'
    cache:
      enabled: false
