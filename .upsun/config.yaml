applications:
  app:
    type: 'php:8.4'
    source:
      root: '/'
      operations:
        update-dependencies:
          command: |
            set -e
            composer update --lock --no-interaction
            if ! git diff --quiet composer.lock; then
              git add composer.lock
              git commit -m "Update composer.lock"
            fi

    build:
      flavor: none

    dependencies:
      php:
        composer/composer: '^2'

    runtime:
      extensions:
        - pdo_pgsql
        - sodium
        - intl
        - mbstring
        - ctype
        - iconv
        - xsl

    hooks:
      build: |
        set -e
        curl -fs https://get.symfony.com/cloud/configurator | bash
        symfony-build
      deploy: symfony-deploy
      post_deploy: |
        set -e
        if [ "$PLATFORM_ENVIRONMENT_TYPE" != "production" ]; then
          # APP_ENV must be set as a real env var here: the platform exports APP_ENV=prod
          # (and composer dump-env bakes it into .env.local.php), which overrides phpunit's
          # `<server name="APP_ENV" value="test" force="true">`, so tests would otherwise
          # boot the prod kernel (no framework.test -> "test.service_container" missing).
          APP_ENV=test php bin/phpunit --colors=never
        fi

    relationships:
      database: 'db:postgresql'
      mercure: 'mercure:mercure'
      vault_kms: 'vault_kms:api-keys'

    # Allow this app (where the weekly_ci cron runs) to trigger the on-demand "ci" task.
    authorizations:
      - type: task
        resource: ci
        action: operate

    mounts:
      '/var': { source: storage, source_path: var }
      '/storage/audio':
        source: service
        service: audio-storage
        source_path: audio

    web:
      commands:
        pre_start: symfony-pre-start
      locations:
        '/':
          root: 'public'
          passthru: '/index.php'
          scripts: true
          allow: true

    variables:
      env:
        APP_ENV: prod
        SEARCH_PROVIDER: postgres
      php:
        upload_max_filesize: 26M
        post_max_size: 27M
        memory_limit: 256M

    workers:
      transcription:
        commands:
          start: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M
        mounts:
          '/var': { source: storage, source_path: var }
          '/storage/audio':
            source: service
            service: audio-storage
            source_path: audio

    crons:
      # The cron only *triggers* the on-demand "ci" task (a cheap API call); the actual
      # branch/test/merge orchestration runs in the dedicated "ci" task container below,
      # so it doesn't consume production app resources. Upsun tasks cannot be scheduled
      # directly — a cron is the supported way to run one on a schedule.
      weekly_ci:
        spec: '0 3 * * 1'
        commands:
          start: php bin/console app:ci-trigger

tasks:
  # On-demand container that runs the dependency-update CI. Triggered weekly by the
  # weekly_ci cron via `app:ci-trigger`. Runs with its own (per-second billed)
  # resources instead of borrowing from the production app container.
  ci:
    type: 'php:8.4'
    source:
      root: '/'

    dependencies:
      php:
        composer/composer: '^2'

    runtime:
      extensions:
        - pdo_pgsql
        - sodium
        - intl
        - mbstring
        - ctype
        - iconv
        - xsl

    # DATABASE_URL/MAILER_DSN are derived from these in .environment; the command itself
    # only orchestrates the Upsun API, but the Symfony kernel needs them to boot in prod.
    relationships:
      database: 'db:postgresql'

    # Symfony needs a writable /var (cache + logs) at runtime — the image filesystem is
    # read-only. CI orchestration keeps nothing between runs, so an ephemeral tmp mount
    # is enough (writable, auto-allocated, no resources:set needed). A private mount also
    # avoids colliding with the production app's /var.
    mounts:
      '/var': { source: tmp, source_path: var }

    # No `env: view` authorization on purpose — the task does NOT inherit the project's
    # secrets ambiently. app:ci-trigger injects exactly the variables ci-run needs into
    # each run's payload instead (PLATFORM_* vars are always provided automatically).

    hooks:
      build: |
        set -e
        curl -fs https://get.symfony.com/cloud/configurator | bash
        symfony-build

    variables:
      env:
        APP_ENV: prod
        SEARCH_PROVIDER: postgres

    run:
      command: php bin/console app:ci-run
      timeout: 7200

services:
  db:
    type: postgresql:16

  mercure:
    type: mercure:0

  audio-storage:
    type: network-storage:2.0

  vault_kms:
    type: vault-kms:1.12
    configuration:
      endpoints:
        api-keys:
          - policy: encrypt
            key: api-keys
            type: encrypt
          - policy: decrypt
            key: api-keys
            type: encrypt

routes:
  'https://{default}/':
    type: upstream
    upstream: 'app:http'

  'https://{default}/.well-known/mercure':
    type: upstream
    upstream: 'mercure:mercure'
    cache:
      enabled: false
